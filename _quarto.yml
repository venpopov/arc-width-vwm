project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - "!AGENTS.md"
    - "!archive/"
    - "**/*.qmd"

execute:
  freeze: auto
  cache: true

website:
  title: "Arc width and continuous reproduction"
  repo-url: https://github.com/venpopov/arc-width-vwm
  repo-actions: [edit, source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home


  sidebar:
    style: docked
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Project details"
        contents:
          - text: "Experiment Description & Data Codebook"
            href: notebooks/experiment-description.qmd
      - section: "Data Exploration"
        contents:
          - text: "Exp 1: Exploratory Analysis"
            href: notebooks/exp1-eda.qmd
          - text: "Exp 1: By-Subject Diagnostics"
            href: notebooks/exp1-by-subject.qmd
          - text: "Honig et al.: Data Exploration"
            href: notebooks/honig-explore.qmd
      - section: "Theory & Model derivations"
        contents:
          - text: "Optimal Arc Width (SDM)"
            href: notebooks/optimal-arc-response.qmd
          - text: "RL Algorithms: Exploration"
            href: notebooks/reinforcement-learning-arc.qmd
          - text: "Algo5 Noise Variants"
            href: notebooks/algo5-noise-variants.qmd
      - section: Model diagnostics
        contents:
          - text: "Contraction-expansion (algo4), MLE"
            href: notebooks/diagnostics-algo4-mle.qmd
          - text: "Contraction-expansion (algo4), Bayesian"
            href: notebooks/diagnostics-algo4-bayes.qmd
          - text: "Stochastic gradient ascent (algo5), MLE"
            href: notebooks/diagnostics-algo5-mle.qmd
          - text: "Stochastic gradient ascent (algo5), Bayesian"
            href: notebooks/diagnostics-algo5-bayes.qmd
      - section: "Model Fits"
        contents:
          - text: "Algo4 Bayesian fit (Exp 1)"
            href: notebooks/fit-algo4-bayes.qmd
          - text: "Algo4 Bayesian fit (Honig)"
            href: notebooks/fit-algo4-bayes-honig.qmd
          - text: "Algo5 Bayesian fit (Exp 1)"
            href: notebooks/fit-algo5-bayes.qmd
      - section: "Empirical Tests"
        contents:
          - text: "Sequential Dependencies"
            href: notebooks/sequential-dependencies.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-link: true
    code-copy: true
    code-overflow: scroll
    grid:
      sidebar-width: 400px



